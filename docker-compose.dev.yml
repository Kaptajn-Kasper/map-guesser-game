# Local development with live reload: docker compose -f docker-compose.dev.yml up
# Then open http://localhost:4200. Needs public/config.js (see ENVIRONMENT_SETUP.md).
services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./:/app
      - /app/node_modules
